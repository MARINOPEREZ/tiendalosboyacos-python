<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Los Boyacos</title>
  <style>
    :root {
      --verde-oscuro: #1B5E20;
      --verde-medio: #2E7D32;
      --verde-claro: #4CAF50;
      --amarillo: #FDB913;
      --rojo-logo: #D32F2F;
      --bg: #f4f6f0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Segoe UI',sans-serif;
      background: linear-gradient(135deg, var(--verde-oscuro), var(--verde-medio));
      min-height:100vh; display:flex; align-items:center; justify-content:center;
    }
    .login-wrap { width:100%; max-width:420px; padding:20px; }

    .logo-box {
      text-align:center; margin-bottom:24px;
    }
    .logo-icono {
      width:80px; height:80px; background:var(--amarillo);
      border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:36px; font-weight:900;
      color:var(--verde-oscuro); border:4px solid white;
      margin:0 auto 12px;
    }
    .logo-box h1 { color:white; font-size:24px; font-weight:900; }
    .logo-box p { color:rgba(255,255,255,.75); font-size:14px; margin-top:4px; }

    .login-card {
      background:white; border-radius:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden;
    }
    .login-header {
      background: linear-gradient(135deg, var(--verde-oscuro), var(--verde-medio));
      padding:20px 28px; color:white;
    }
    .login-header h2 { font-size:20px; font-weight:900; }
    .login-header p { font-size:13px; opacity:.8; margin-top:4px; }

    .login-body { padding:28px; }

    .campo-grupo { margin-bottom:18px; }
    .campo-grupo label {
      display:block; font-size:12px; font-weight:700;
      color:#666; margin-bottom:7px; text-transform:uppercase;
      letter-spacing:.5px;
    }
    .campo-grupo input {
      width:100%; padding:13px 16px;
      border:2px solid #e8e8e8; border-radius:12px;
      font-size:15px; transition:.2s; background:#fafafa;
    }
    .campo-grupo input:focus {
      border-color:var(--verde-claro); outline:none;
      background:white; box-shadow:0 0 0 3px rgba(76,175,80,.1);
    }

    .alerta {
      padding:13px 16px; border-radius:10px; margin-bottom:18px;
      font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px;
    }
    .alerta-error {
      background:#fde8e8; color:var(--rojo-logo);
      border-left:4px solid var(--rojo-logo);
    }

    .btn-login {
      width:100%; background:var(--verde-claro); color:white;
      border:none; border-radius:12px; padding:14px;
      font-size:16px; font-weight:900; cursor:pointer; transition:.2s;
    }
    .btn-login:hover { background:var(--verde-oscuro); }

    .login-footer {
      text-align:center; margin-top:20px;
      font-size:13px; color:#888;
    }
    .login-footer a {
      color:var(--verde-oscuro); font-weight:700; text-decoration:none;
    }
  </style>
</head>
<body>

  <div class="login-wrap">

    <div class="logo-box">
      <div class="logo-icono">LB</div>
      <h1>TIENDA LOS BOYACOS</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <div class="login-card">

      <div class="login-header">
        <h2>🔐 Iniciar Sesión</h2>
        <p>Ingresa tus credenciales de acceso</p>
      </div>

      <div class="login-body">

        {% if error %}
        <div class="alerta alerta-error">
          ❌ {{ error }}
        </div>
        {% endif %}

        <form method="POST">
          <div class="campo-grupo">
            <label>📧 Correo electrónico</label>
            <input type="email" name="mail" required
              placeholder="admin@losboyacos.com"
              value="{{ mail_previo or '' }}">
          </div>
          <div class="campo-grupo">
            <label>🔑 Contraseña</label>
            <input type="password" name="password" required
              placeholder="••••••••">
          </div>
          <button class="btn-login" type="submit">
            Ingresar →
          </button>
        </form>

        <div class="login-footer">
          <a href="/">← Volver a la tienda</a>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
