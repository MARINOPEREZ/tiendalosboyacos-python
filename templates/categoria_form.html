<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo }} — Los Boyacos</title>
  <style>
    :root {
      --verde-oscuro: #1B5E20;
      --verde-medio: #2E7D32;
      --verde-claro: #4CAF50;
      --amarillo: #FDB913;
      --amarillo-claro: #FFF9E6;
      --rojo-logo: #D32F2F;
      --bg: #f4f6f0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:#333; }

    header {
      background: linear-gradient(135deg, var(--verde-oscuro), var(--verde-medio));
      padding: 0 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.3);
    }
    .header-inner {
      max-width:1200px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between;
      padding: 14px 0;
    }
    .logo-wrap { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .logo-icon {
      width:48px; height:48px; background:var(--amarillo);
      border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:22px; font-weight:900;
      color:var(--verde-oscuro); border:3px solid white;
    }
    .logo-text { color:white; }
    .logo-text strong { font-size:18px; }
    .logo-text span { display:block; font-size:11px; opacity:.8; }
    .btn-nav {
      background:var(--amarillo); color:var(--verde-oscuro);
      border:none; border-radius:20px; padding:8px 18px;
      font-weight:700; font-size:13px; cursor:pointer;
      text-decoration:none;
    }

    main { max-width:600px; margin:30px auto; padding:0 16px; }

    .form-card {
      background:white; border-radius:20px;
      box-shadow:0 4px 20px rgba(0,0,0,.1); overflow:hidden;
    }
    .form-header {
      background: linear-gradient(135deg, var(--verde-oscuro), var(--verde-medio));
      padding:24px 28px; display:flex; align-items:center; gap:16px;
    }
    .form-icono {
      width:56px; height:56px; background:var(--amarillo);
      border-radius:14px; display:flex; align-items:center;
      justify-content:center; font-size:28px; border:3px solid rgba(255,255,255,.3);
    }
    .form-header-info h1 { color:white; font-size:22px; font-weight:900; }
    .form-header-info p { color:rgba(255,255,255,.8); font-size:14px; margin-top:4px; }

    .form-body { padding:28px; }

    .campo-grupo { margin-bottom:20px; }
    .campo-grupo label {
      display:block; font-size:13px; font-weight:700;
      color:#555; margin-bottom:7px; text-transform:uppercase;
      letter-spacing:.4px;
    }
    .campo-grupo input {
      width:100%; padding:12px 16px;
      border:2px solid #e8e8e8; border-radius:12px;
      font-size:15px; font-family:'Segoe UI',sans-serif;
      transition:.2s; background:#fafafa; color:#333;
    }
    .campo-grupo input:focus {
      border-color:var(--verde-claro); outline:none;
      background:white; box-shadow:0 0 0 3px rgba(76,175,80,.1);
    }

    .alerta {
      padding:14px 18px; border-radius:12px; margin-bottom:20px;
      font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px;
    }
    .alerta-exito { background:#e8f5e9; color:var(--verde-oscuro); border-left:4px solid var(--verde-claro); }
    .alerta-error { background:#fde8e8; color:var(--rojo-logo); border-left:4px solid var(--rojo-logo); }

    .form-footer {
      display:flex; gap:12px; justify-content:flex-end;
      padding-top:20px; border-top:2px solid #f0f0f0; margin-top:8px;
    }
    .btn-cancelar {
      background:#f0f0f0; color:#666;
      border:none; border-radius:20px; padding:11px 24px;
      font-weight:700; font-size:14px; cursor:pointer;
      text-decoration:none; transition:.2s;
    }
    .btn-cancelar:hover { background:#e0e0e0; }
    .btn-guardar {
      background:var(--verde-claro); color:white;
      border:none; border-radius:20px; padding:11px 28px;
      font-weight:700; font-size:14px; cursor:pointer; transition:.2s;
    }
    .btn-guardar:hover { background:var(--verde-oscuro); }
    .btn-guardar.editar { background:var(--amarillo); color:var(--verde-oscuro); }
    .btn-guardar.editar:hover { background:#e6a800; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a class="logo-wrap" href="/">
        <div class="logo-icon">LB</div>
        <div class="logo-text">
          <strong>Los Boyacos</strong>
          <span>Tienda Virtual</span>
        </div>
      </a>
      <a class="btn-nav" href="/categorias">← Categorías</a>
    </div>
  </header>

  <main>
    <div class="form-card">

      <div class="form-header">
        <div class="form-icono">🏷️</div>
        <div class="form-header-info">
          <h1>{{ titulo }}</h1>
          <p>{{ subtitulo }}</p>
        </div>
      </div>

      <div class="form-body">

        {% if mensaje %}
        <div class="alerta {{ 'alerta-exito' if exito else 'alerta-error' }}">
          {{ '✅' if exito else '⚠️' }} {{ mensaje }}
        </div>
        {% endif %}

        <form method="POST">
          <div class="campo-grupo">
            <label>Nombre de la categoría</label>
            <input type="text" name="nom_categoria" maxlength="30" required
                   placeholder="Ej: Lácteos"
                   value="{{ categoria.Nom_Categoria if categoria else '' }}">
          </div>

          <div class="form-footer">
            <a class="btn-cancelar" href="/categorias">Cancelar</a>
            <button class="btn-guardar {{ 'editar' if categoria else '' }}" type="submit">
              {{ '💾 Guardar cambios' if categoria else '➕ Crear categoría' }}
            </button>
          </div>
        </form>

      </div>
    </div>
  </main>

</body>
</html>
