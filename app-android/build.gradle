buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Misma version que ya se probo y funciono en AA2-EV01.
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
